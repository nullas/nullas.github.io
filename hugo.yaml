baseURL: https://nullas.github.io/
locale: en-us
title: I Don't Understand
theme: ["PaperMod"]
params:
  defaultTheme: dark
  disableThemeToggle: true
menu:
  main:
  - identifier: posts
    name: Posts
    url: /posts/
    weight: 10
  - identifier: about
    name: About
    url: /about/
    weight: 20
markup:
  goldmark:
    extensions:
      passthrough:
        delimiters:
          block:
          - - \[
            - \]
          - - $$
            - $$
          inline:
          - - \(
            - \)
        enable: true

